{{ define "main" }}
<article class="single-note">
  <header class="single-header">
    <p class="note-meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02 Jan 2006" }}</time>{{ with .Params.tags }} · {{ delimit . ", " }}{{ end }}</p>
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="lede">{{ . }}</p>{{ end }}
  </header>
  <div class="prose">{{ .Content }}</div>
  <footer class="post-footer"><a href="{{ "" | relURL }}">← back to all notes</a></footer>
</article>
{{ end }}
