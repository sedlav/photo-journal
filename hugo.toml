baseURL = 'https://example.com/'
title = 'left, right, left!'
paginate = 10
enableRobotsTXT = true

[params]
  description = 'photo-commentary, and small stories from ordinary days.'
  author = 'Joaquin Valdes'
  location = 'Minnesota, USA'

locale = 'en-us'

[taxonomies]
  tag = 'tags'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[permalinks]
  posts = '/notes/:slug/'
