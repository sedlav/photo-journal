baseURL = 'https://example.com/'
title = 'del austral al boreal'
locale = 'en-us'
enableRobotsTXT = true
disableKinds = ['taxonomy', 'term']

[pagination]
  pagerSize = 10

[params]
  description = 'photo-commentary, and small stories from ordinary days.'
  author = 'Joaquin Valdes'
  location = 'Minnesota, USA'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[permalinks]
  posts = '/notes/:slug/'
