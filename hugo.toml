baseURL = 'https://example.com/'
title = 'Field Notes'
paginate = 10
enableRobotsTXT = true

[params]
  description = 'Photographs, observations, and small stories from ordinary days.'
  author = 'Your Name'
  location = 'Somewhere, USA'

locale = 'en-us'

[taxonomies]
  tag = 'tags'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[permalinks]
  posts = '/notes/:slug/'
